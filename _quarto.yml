project:
  type: website

website:
  title: "Reproducible Research · Course Blog"
  description: "One week of reproducible bioinformatics"
  navbar:
    right:
      - text: Home
        href: index.qmd
      - text: About
        href: about.qmd
      - icon: github
        # replace with the address of YOUR repository
        href: https://github.com/zanabrilej22/New_blog.git 
  page-footer:
    center: "Zana Brilej · Reproducible Research in Bioinformatics, September 2026"

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-title: "On this page"
    code-copy: true
    code-overflow: wrap
    highlight-style: github

# Re-run code only when a post changes. The stored results go into the
# _freeze/ folder, which you commit to GitHub so GitHub Actions does not
# have to run R or bash itself.
execute:
  freeze: auto
